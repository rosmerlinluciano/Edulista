name: Pruebas de EduLista

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar pruebas
        run: npm test
